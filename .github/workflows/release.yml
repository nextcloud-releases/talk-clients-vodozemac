# The tag points to a commit that only sets the URL and checksum in Package.swift, so no branch is pushed

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.0"
        required: true

permissions:
  contents: read

env:
  XCODE_VERSION: "26.5"
  GRADLE_VERSION: "9.7.1"
  NDK_VERSION: "28.2.13676358"
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  android:
    name: Build AAR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # The runner image ships the SDK, only the NDK is missing
      - name: Install NDK
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@${CARGO_NDK_VERSION}

      - name: Build AAR
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/build-android.sh
          mkdir -p build/android
          cp android/lib/build/outputs/aar/lib-release.aar "build/android/talk-clients-vodozemac-$VERSION.aar"
          cp android/lib/build/publications/release/pom-default.xml "build/android/talk-clients-vodozemac-$VERSION.pom"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: build/android
          if-no-files-found: error

  release:
    name: Release ${{ inputs.version }}
    runs-on: macos-26
    needs: android
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Invalid version $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists"
            exit 1
          fi

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build XCFramework
        run: ./scripts/build-xcframework.sh

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android
          path: build/android

      # Through the API, so GitHub signs the commit
      - name: Tag release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          checksum=$(swift package compute-checksum build/TalkOlmFFI.xcframework.zip)
          url="https://github.com/$REPOSITORY/releases/download/$VERSION/TalkOlmFFI.xcframework.zip"

          sed -i '' \
            -e "s|^let releaseURL = .*|let releaseURL = \"$url\"|" \
            -e "s|^let releaseChecksum = .*|let releaseChecksum = \"$checksum\"|" \
            Package.swift
          git diff --exit-code --quiet Package.swift && { echo "Package.swift was not updated"; exit 1; }

          parent=$(git rev-parse HEAD)
          base_tree=$(gh api "repos/$REPOSITORY/git/commits/$parent" --jq .tree.sha)
          tree=$(jq -n --arg base "$base_tree" --rawfile content Package.swift \
              '{base_tree: $base, tree: [{path: "Package.swift", mode: "100644", type: "blob", content: $content}]}' \
            | gh api "repos/$REPOSITORY/git/trees" --input - --jq .sha)
          commit=$(jq -n --arg tree "$tree" --arg parent "$parent" --arg message "chore: Release $VERSION" \
              '{message: $message, tree: $tree, parents: [$parent]}' \
            | gh api "repos/$REPOSITORY/git/commits" --input - --jq .sha)
          gh api "repos/$REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$commit" >/dev/null

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "vodozemac $(cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "vodozemac") | .version'), see THIRD_PARTY_LICENSES.md for the licences of all bundled crates." \
            build/TalkOlmFFI.xcframework.zip \
            build/android/*.aar \
            build/android/*.pom \
            THIRD_PARTY_LICENSES.md
