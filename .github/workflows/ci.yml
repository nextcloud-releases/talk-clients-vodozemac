name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
  XCODE_VERSION: "26.5"

jobs:
  rust:
    name: Rust tests and libolm interop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain comes from rust-toolchain.toml
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --features bindgen -- -D warnings

      - name: Tests
        run: cargo test --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interop/package-lock.json

      - name: Interop with libolm
        run: |
          cargo build --locked --example interop_peer
          npm ci --prefix interop
          node interop/interop.mjs target/debug/examples/interop_peer

  generated:
    name: Generated files are up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-about
        run: cargo install --locked cargo-about@0.9.2 --features cli

      - name: Generate
        run: |
          ./scripts/generate-bindings.sh
          ./scripts/generate-licenses.sh

      - name: Check for changes
        run: git diff --exit-code -- swift/Sources THIRD_PARTY_LICENSES.md

  ios:
    name: XCFramework and Swift tests
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build XCFramework
        run: ./scripts/build-xcframework.sh

      - name: Swift tests
        env:
          TALK_OLM_LOCAL_BUILD: "1"
        run: |
          # Without it, xcodebuild may find no simulators on a fresh runner
          xcrun simctl list > /dev/null

          set -o pipefail && \
          xcodebuild test \
          -scheme TalkOlm \
          -destination '${{ env.DESTINATION }}' \
          | xcbeautify --quieter

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TalkOlmFFI.xcframework
          path: build/TalkOlmFFI.xcframework.zip
          if-no-files-found: error
